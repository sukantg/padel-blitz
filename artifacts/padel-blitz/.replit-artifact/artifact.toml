kind = "web"
previewPath = "/"
title = "Padel Blitz"
version = "1.0.0"
id = "artifacts/padel-blitz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25655

[services.development]
run = "pnpm --filter @workspace/padel-blitz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/padel-blitz", "run", "build" ]
publicDir = "artifacts/padel-blitz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25655"
BASE_PATH = "/"
